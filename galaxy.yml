---
namespace: 'r_pufky'
name: 'data'
version: '3.2.1'
readme: 'README.md'
authors:
  - 'Robert Pufky <rpufky@gmail.com> (https://github.com/r-pufky)'
description: >
  Data annotations. Provide high-resolution, data-centric processing for roles
  addressing many shortcomings of argument spec and unit testing.
license_file: 'LICENSE'
tags:
  - 'data'
  - 'annotation'
  - 'tools'
  - 'test'
  - 'unit'
dependencies: {}

repository: 'https://github.com/r-pufky/ansible_collection_data'
documentation: 'https://r-pufky.github.io/ansible_docs'
homepage: 'https://github.com/r-pufky/ansible_collection_data'
issues: 'https://github.com/r-pufky/ansible_collection_data/issues'

# Do not include: testing, environments, caches, IDE settings, or staging
# messages in release tarball.
build_ignore:
  - '*.ansible'
  - '*.gitignore'
  - '*.gitattributes'
  - '*.gitmodules'
  - '*.git'
  - '*.venv'
  - '*.envrc'
  - '*.vscode'
  - '*molecule'
  - 'ansible.env'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'TODO.md'
  - 'COMMIT.md'
